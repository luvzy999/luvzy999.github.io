<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <title>Music Player</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
    #app { max-width: 800px; margin: 0 auto; background: white; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden; }
    .player { padding: 20px; }
    .controls { display: flex; justify-content: space-between; margin: 20px 0; }
    button { padding: 10px 20px; font-size: 16px; border: none; border-radius: 8px; cursor: pointer; margin: 0 10px; }
    button:hover { opacity: 0.9; }
    .track-info { font-size: 18px; font-weight: bold; margin: 10px 0; }
    .playlist ul {-ms-overflow-style: none;scrollbar-width: none; /* Firefox */ margin: 20px 0;overflow-y: hidden; max-height: 300px; border-top: 1px solid #eee; border-bottom: 1px solid #eee;}
    .playlist ul::-webkit-scrollbar {
      display: none;
      }
    .playlist ul { list-style: none; padding: 0;overflow-y: scroll; max-height: 300px; margin: 0; }
    .playlist li { padding: 12px 20px; border-bottom: 1px solid #eee; cursor: pointer; transition: background 0.2s; }
    .playlist li:hover { background: #f9f9f9; }
    .lyrics { margin: 20px 0; font-size: 16px; line-height: 1.6;color: #ff00d4; }
    .lyrics ul { list-style: none; padding: 0; overflow-y:hidden; max-height: 50px; margin: 10px;}
    .lyrics li { padding: 6px 0; overflow-y:hidden; }
    .progressbar { height: 5px; background: #eee; border-radius: 5px; overflow: hidden; margin-top: 10px; }
  
  </style>
</head>
<body>
  <div id="app">
  
    <div class="player">   
      <div class="track-info">{{ currentTrack.title }} - {{ currentTrack.author }}</div>
      <div class="controls">
        <button @click="prevTrack">⏮</button>
        <button @click=" playTrack">{{ playPauseText }}</button>
        <button @click="nextTrack">⏭</button>
     
      </div>
         <div class="progressbar">
          <div class="thumb" style=" height:10px; background: #ff00d4; transition: width 0.1s;overflow: hidden;" :style="{ width: progressPercentage + '%' }"></div>
         </div>
      <div class="playlist">
        <ul>
          <li v-for="(track, index) in playlist" :key="index" :class="{ 'active': index === currentTrackIndex }" @click="selectTrack(index)">
            {{ track.title }} - {{ track.author }}
          </li>
        </ul>
      </div>
      <div class="lyrics">
        <ul>
         <li>{{ currentLyric }}</li>
        </ul>
      </div>
    </div>
  </div>

  <script> 
  const mplayer = new Audio();
  mplayer.preload = true;
  mplayer.autoplay = true;
  const instance = axios.create({
  baseURL: 'https://api.i-meto.com/meting/',
  timeout: 6000
  });
  const log = (...args) => {
    console.log(...args);};
    const requestMediaRes = async () => {
        const response = await instance.get('api?server=netease&type=playlist&id=470618814', {
            headers: {
                'Content-Type': 'application/json'
            }
        }).then(response => {
            // console.log('Fetched playlist:', response.data);
            return response.data;
        }).catch(error => {
            console.error('Error fetching playlist:', error);
            return [];
        });
        return response;
    }; 
  new Vue({
    el: '#app',
    data: {
      playlist: [],//歌单
      lrc: [],//歌词列表
      currentTrackIndex: 0,//当前播放的歌曲索引
      currentTrack: {},//当前播放的歌曲对象
      playPauseText: '▶', // 播放/暂停按钮的文本
      currentLyric: '',//当前播放的歌词
      duration: 0,//当前播放的歌曲总时长
      currentTime: 0,//当前播放的歌曲时间点
      progressPercentage:0  //当前播放的歌曲进度百分比
    },
    methods: {
      playTrack() {
          if (mplayer.paused) {
          mplayer.src = this.currentTrack.url;
          mplayer.play();
          this.showLrc();
          this.progressUpdate();
          this.playPauseText = '❚❚';
        } else {
          mplayer.pause();
          this.playPauseText = '▶';
        }
      },
      selectTrack(index) {
        this.currentTrackIndex = index;
        this.currentTrack = this.playlist[index];
        this.playTrack();
      },
       
      nextTrack() {
        this.currentTrackIndex = (this.currentTrackIndex + 1) % this.playlist.length;
        this.currentTrack = this.playlist[this.currentTrackIndex];
        this.playTrack();
      },
      prevTrack() {
        this.currentTrackIndex = (this.currentTrackIndex - 1 + this.playlist.length) % this.playlist.length;
        this.currentTrack = this.playlist[this.currentTrackIndex];
        this.playTrack();
      } ,
      progressUpdate() {
        const that = this;
        const update = () => {
          if (!mplayer.paused) {
            that.currentTime = mplayer.currentTime;
            that.duration = mplayer.duration;
            that.progressPercentage = (that.currentTime / that.duration) * 100;
            // that.currentLyric = that.lrc.find( <= that.currentTime)?.text || '';
            that.updateLrc();
            requestAnimationFrame(update);
          }
        };
        requestAnimationFrame(update);
      }, 
      updateLrc(){
        const lyric = this.lrc; 
        for(var i=0;i<lyric.length;i++){
          if(this.currentTime>=lyric[i].time&& (!lyric[i + 1] || this.currentTime < lyric[i + 1].time)){
            this.currentLyric = lyric[i].text;
          }
        }
      },
      showLrc() {
        //请求歌词数据
       axios.get(this.playlist[this.currentTrackIndex].lrc)
          .then(response => {
            const lrcData = response.data;
            const lines = lrcData.split('\n');//将请求结果拆分成行
            const lrcLines = lines.map(line => {
              const match = line.match(/\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/);
              if (match) {
                const minutes = parseInt(match[1], 10);
                const seconds = parseInt(match[2], 10);
                const milliseconds = parseInt(match[3], 10);
                const text = match[4].trim();
                return { time: minutes * 60 + seconds + milliseconds / 1000, text };
              }
              return null;
            }).filter(line => line !== null);
            this.lrc = lrcLines;//[{time,text}],
          })
          .catch(error => {
            console.error('Error fetching lyrics:', error);
          });
      },
      mediaRes(){
        const that = this;
        requestMediaRes().then(data => { 
          if (data.length > 0) {
             that.playlist = data;
            //  console.log('Current track:', that.playlist[70].title, that.SSplaylist[0].author);
             that.currentTrack = data[0];
          } else {
            console.log(currentTrack.title, currentTrack.author);
          }
        }).catch(error => {
          console.error('Error in mediaRes:', error);
        });
      }
    },
    created() {
      this.mediaRes(); 
      
    }
  });
  </script>
</body>
</html>
